<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soqóno | Technical Research Operations</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
    <!-- Flip Library CSS -->
    <link href="https://unpkg.com/@pqina/flip/dist/flip.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="waveCanvas"></canvas>
    
    <div class="bg-canvas">
        <div class="grain-overlay"></div>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <nav class="main-nav">
        <div class="logo">soqóno</div>
        <div class="nav-links">
            <a href="#">Who we are</a>
            <span class="nav-divider">//</span>
            <a href="#">What we do</a>
            <span class="nav-divider">//</span>
            <a href="mailto:team@soqono.com">CONTACT: TEAM@SOQONO.COM</a>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-inner">
            <div class="headline-container">
                <div class="hud-tag">GLOBAL PARTNER // NEXT-GEN TECH</div>
                
                <h1 class="text-row">TECHNICAL</h1>
                <div class="window">
                    <!-- The Flip Display Board -->
                    <div class="tick" id="flip-board">
                        <div data-repeat="true" data-layout="horizontal center">
                            <span data-view="flip"></span>
                        </div>
                    </div>
                </div>
                <h1 class="text-row">OPERATIONS</h1>
                
                <div class="hud-corner-tr"></div>
                <div class="hud-corner-bl"></div>
            </div>

            <div class="industry-list">
                <a href="#" class="industry-item">
                    <span class="item-index">01 //</span>
                    <span class="item-text">Consumer<br>Electronics</span>
                </a>
                <a href="#" class="industry-item">
                    <span class="item-index">02 //</span>
                    <span class="item-text">Robotics &<br>Autonomy</span>
                </a>
                <a href="#" class="industry-item">
                    <span class="item-index">03 //</span>
                    <span class="item-text">Frontier<br>AI</span>
                </a>
                <a href="#" class="industry-item">
                    <span class="item-index">04 //</span>
                    <span class="item-text">Adaptive<br>Enterprise</span>
                </a>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-left">
            BASED IN CALIFORNIA <span class="nav-divider">//</span> COPYRIGHT 2026 
            <span class="nav-divider" style="margin-left:15px">//</span> 
            <span style="opacity:0.5">NO-COOKIE SITE</span>
        </div>
        <div class="footer-right" id="local-clock"></div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
    <script src="https://unpkg.com/@pqina/flip/dist/flip.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
