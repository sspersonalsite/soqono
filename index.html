<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <canvas id="waveCanvas"></canvas>

    <div class="bg-canvas">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <svg class="noise-overlay">
            <filter id="grain">
                <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />

            <rect width="100%" height="100%" filter="url(#grain)" />
        </svg>
    </div>

    <nav class="main-nav">

        <div class="nav-links">

    </nav>

    <main class="hero">
        <div class="headline-container">
            <div class="hud-tag">ID_099 // SYSTEM_PRIMARY</div>
            
            <h1 class="text-row">TECHNICAL</h1>
            <div class="window">
                <span class="text-row" id="scramble-target">RESEARCH</span>
            </div>
            <h1 class="text-row">OPERATIONS</h1>

            <div class="hud-corner-bl"></div>
            <div class="hud-corner-tr"></div>
        </div>

        <div class="industry-list">
            <a href="#" class="industry-item"><span class="item-index">01 //</span> Consumer Electronics</a>
            <a href="#" class="industry-item"><span class="item-index">02 //</span> Robotics & Autonomy</a>

            <a href="#" class="industry-item"><span class="item-index">04 //</span> Smart Infrastructure</a>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
