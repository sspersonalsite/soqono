<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soqóno | Technical Research Operations</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/@pqina/flip/dist/flip.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>.tick-credits { display: none !important; }</style>
</head>
<body>
    <canvas id="waveCanvas"></canvas>
    
    <div class="bg-canvas">
        <div class="grain-overlay"></div>
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <button id="sound-toggle" aria-label="Toggle Sound">
        <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM3 9v6h4l5 5V4L7 9H3z"/></svg>
    </button>

    <nav class="main-nav">
        <div class="logo">soqóno</div>
        <div class="nav-links">
            <a href="#">Who we are</a>
            <span class="nav-divider">//</span>
            <a href="#">What we do</a>
            <span class="nav-divider">//</span>
            <a href="mailto:team@soqono.com">CONTACT: TEAM@SOQONO.COM</a>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-inner">
            <div class="headline-container">
                <div class="hud-tag">GLOBAL PARTNER // NEXT-GEN TECH</div>
                
                <div class="text-row tick" id="tick-technical">
                    <div data-repeat="true" data-layout="horizontal center">
                        <span data-view="flip"></span>
                    </div>
                </div>

                <div class="window">
                    <div class="text-row tick" id="tick-research">
                        <div data-repeat="true" data-layout="horizontal center">
                            <span data-view="flip"></span>
                        </div>
                    </div>
                </div>

                <div class="text-row tick" id="tick-operations">
                    <div data-repeat="true" data-layout="horizontal center">
                        <span data-view="flip"></span>
                    </div>
                </div>

                <div class="hud-corner-tr"></div>
                <div class="hud-corner-bl"></div>
            </div>

            <div class="industry-list">
                <a href="#" class="industry-item">
                    <span class="item-index">01 //</span>
                    <span class="item-text">Consumer Electronics</span>
                </a>
                <a href="#" class="industry-item">
                    <span class="item-index">02 //</span>
                    <span class="item-text">Robotics & Autonomy</span>
                </a>
                <a href="#" class="industry-item">
                    <span class="item-index">03 //</span>
                    <span class="item-text">Frontier AI</span>
                </a>
                <a href="#" class="industry-item">
                    <span class="item-index">04 //</span>
                    <span class="item-text">Adaptive Enterprise</span>
                </a>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-left">BASED IN CALIFORNIA // COPYRIGHT 2026 // <span style="opacity:0.5">NO-COOKIE SITE</span></div>
        <div class="footer-right" id="local-clock"></div>
    </footer>

    <script src="https://unpkg.com/@pqina/flip/dist/flip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
