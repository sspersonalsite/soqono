<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soqóno | Technical Program Operations</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=30.0">
</head>
<body>
    <canvas id="waveCanvas"></canvas>

    <div class="bg-canvas">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <svg class="noise-overlay">
            <filter id="grain">
                <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
                <feColorMatrix type="saturate" values="0" />
            </filter>
            <rect width="100%" height="100%" filter="url(#grain)" />
        </svg>
    </div>

    <nav class="main-nav">
        <div class="logo">soqóno</div>
        <div class="nav-links">
            <a href="#">Experience</a>
            <span class="nav-divider">//</span>
            <a href="#">Industry</a>
            <span class="nav-divider">//</span>
            <a href="#">Services</a>
        </div>
    </nav>

    <main class="hero">
        <div class="hero-inner">
            <div class="headline-container">
                <div class="hud-tag">LOC: GLOBAL_PARTNER // TECH: NEXT_GEN</div>
                <h1 class="text-row">TECHNICAL</h1>
                <div class="window">
                    <span class="text-row" id="scramble-target">GLOBAL_PARTNER // NEXT_GEN_TECH</span>
                </div>
                <h1 class="text-row">OPERATIONS</h1>
                <div class="hud-corner-bl"></div>
                <div class="hud-corner-tr"></div>
            </div>

            <div class="industry-list">
                <a href="#" class="industry-item">
                    <span class="item-index">01 //</span>
                    <span class="item-text">Consumer<br>Electronics</span>
                </a>
                <a href="#" class="industry-item">
                    <span class="item-index">02 //</span>
                    <span class="item-text">Robotics &<br>Autonomy</span>
                </a>
                <a href="#" class="industry-item">
                    <span class="item-index">03 //</span>
                    <span class="item-text">Frontier<br>AI</span>
                </a>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <div class="footer-left">BASED IN CALIFORNIA // COPYRIGHT 2026</div>
        <div class="footer-right">
            <a href="mailto:team@soqono.com" class="footer-email">CONTACT US: TEAM@SOQONO.COM</a>
        </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/simplex-noise@2.4.0/simplex-noise.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
