<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soqóno | Technical Program Operations</title>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body>

    <nav class="main-nav">
        <div class="logo">soqóno</div>
        <div class="nav-links">
            <a href="#">About</a> <a href="#">Services</a> <a href="#">Applications</a> <a href="#">Experience</a> <a href="#">Let's Talk</a>
        </div>
    </nav>

    <main class="hero">
        <div class="headline-container">
            <svg viewBox="0 0 800 650" preserveAspectRatio="xMinYMid meet">
                <defs>
                    <clipPath id="mainClip">
                        <text x="0" y="150" class="svg-text">TECHNICAL</text>
                        <g id="wordStack">
                            <text x="0" y="375" class="svg-text rotating">RESEARCH</text>
                            <text x="0" y="600" class="svg-text rotating">DATA</text>
                            <text x="0" y="825" class="svg-text rotating">BUSINESS</text>
                            <text x="0" y="1050" class="svg-text rotating">PROGRAM</text>
                            <text x="0" y="1275" class="svg-text rotating">STRATEGY</text>
                            <text x="0" y="1500" class="svg-text rotating">PRODUCT</text>
                            <text x="0" y="1725" class="svg-text rotating">RESEARCH</text>
                        </g>
                        <text x="0" y="600" class="svg-text">OPERATIONS</text>
                    </clipPath>
                </defs>
                
                <image href="prores.png" width="1000" height="1500" x="-100" y="-200" clip-path="url(#mainClip)" preserveAspectRatio="xMidYMid slice" />
            </svg>
        </div>

        <div class="industry-list">
            <a href="#" class="industry-item">Consumer<br>Electronics</a>
            <a href="#" class="industry-item">Robotics &<br>Autonomy</a>
            <a href="#" class="industry-item">Frontier<br>AI</a>
            <a href="#" class="industry-item">Smart<br>Infrastructure</a>
        </div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
