<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soqóno | basic-test2</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://unpkg.com/@pqina/flip/dist/flip.min.css" rel="stylesheet">
    <style>
        :root { --bg-color: #2B2D42; --tile-bg: #1a1b2b; --text-color: #EDF2F4; }
        body { background: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; font-family: sans-serif; }
        
        #sound-toggle { position: fixed; top: 20px; right: 20px; background: transparent; border: 1px solid rgba(255,255,255,0.2); padding: 10px; border-radius: 50%; cursor: pointer; z-index: 100; display: flex; align-items: center; }
        #sound-toggle svg { fill: #fff; width: 20px; height: 20px; opacity: 0.4; transition: opacity 0.3s; }
        #sound-toggle.is-active svg { opacity: 1; }

        .tick { font-size: 5.5rem; color: var(--text-color); }
        .tick-credits { display: none !important; }

        /* Centering Fix (Screenshot 2026-05-02 160554.png) */
        .tick-flip { width: 1.2em; height: 1.5em; background-color: var(--tile-bg) !important; border-radius: 4px !important; margin: 0 0.05em; }
        .tick-flip-panel { display: grid !important; place-content: center !important; background-color: var(--tile-bg) !important; border-bottom: 1px solid rgba(0,0,0,0.4); }
        .tick-flip-text-wrapper { position: static !important; display: block !important; line-height: 1 !important; text-indent: 0 !important; }
    </style>
</head>
<body>

    <button id="sound-toggle" aria-label="Toggle Sound">
        <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM3 9v6h4l5 5V4L7 9H3z"/></svg>
    </button>

    <div class="tick" id="mechanical-board">
        <div data-repeat="true" data-layout="horizontal center">
            <span data-view="flip"></span>
        </div>
    </div>

    <script src="https://unpkg.com/@pqina/flip/dist/flip.min.js"></script>

    <script>
        // 1. Audio Engine
        const clickSound = new Audio('click.m4a');
        clickSound.volume = 0.15;
        let soundEnabled = false;

        document.getElementById('sound-toggle').onclick = function() {
            soundEnabled = !this.classList.toggle('is-active');
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                clickSound.play().then(() => { clickSound.pause(); clickSound.currentTime = 0; });
            }
        };

        function playClick() {
            if (!soundEnabled) return;
            const s = clickSound.cloneNode();
            s.volume = 0.15;
            s.play().catch(() => {});
        }

        // 2. Mechanical Logic
        const charSet = " ABCDEFGHIJKLMNOPQRSTUVWXYZ"; 
        const rawWords = ["RESEARCH", "DATA", "PROGRAM", "STRATEGY", "PRODUCT"];
        const maxLen = 8;
        const prepareWord = (word) => word.padEnd(maxLen, " ");

        const boardEl = document.getElementById('mechanical-board');
        const board = Tick.DOM.create(boardEl, {
            value: " ".repeat(maxLen)
        });

        let currentStringArray = " ".repeat(maxLen).split("");

        /**
         * Logic: For each tile, flip through the alphabet one-by-one 
         * until it reaches the target character.
         */
        function rotateTileToTarget(index, targetChar) {
            const stepInterval = 70; // Speed of the physical flip

            const runner = setInterval(() => {
                let currentChar = currentStringArray[index];
                let currentIndex = charSet.indexOf(currentChar);
                let targetIndex = charSet.indexOf(targetChar);

                if (currentChar === targetChar) {
                    clearInterval(runner);
                    return;
                }

                // Move to next char in the reel
                let nextIndex = (currentIndex + 1) % charSet.length;
                currentStringArray[index] = charSet[nextIndex];
                
                // Update the board and play sound
                board.value = currentStringArray.join("");
                playClick();

            }, stepInterval);
        }

        function updateWholeBoard(newWord) {
            const targetChars = newWord.toUpperCase().split("");
            
            targetChars.forEach((char, i) => {
                // Stagger the start of each tile journey
                setTimeout(() => {
                    rotateTileToTarget(i, char);
                }, i * 150); 
            });
        }

        // Start the loop
        let wordIndex = 0;
        
        // Initial kick-off
        setTimeout(() => updateWholeBoard(prepareWord(rawWords[0])), 1000);

        setInterval(() => {
            wordIndex = (wordIndex + 1) % rawWords.length;
            updateWholeBoard(prepareWord(rawWords[wordIndex]));
        }, 8000); // 8s to allow full alphabetical rotations
    </script>
</body>
</html>
