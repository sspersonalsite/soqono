<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soqóno | High-Fidelity Mechanical Board</title>
    <!-- 1. PQINA Flip Library CSS -->
    <link href="https://unpkg.com/@pqina/flip/dist/flip.min.css" rel="stylesheet">
    <style>
        body { 
            background: #2B2D42; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }

        /* 2. Board Styling based on Screenshot 2026-05-02 151723.jpg */
        .tick { 
            font-size: 5.5rem; 
            font-family: sans-serif; 
            color: #EDF2F4; 
        }

        /* Get rid of the "Powered by PQINA" text as requested */
        .tick-credits { 
            display: none !important; 
        }

        /* Force each letter into an independent mechanical tile[cite: 1, 3] */
        .tick-flip {
            width: 1.1em; 
            height: 1.5em;
            background-color: #1a1b2b !important;
            border-radius: 4px !important;
            margin: 0 0.05em;
        }

        .tick-flip-panel {
            background-color: #1a1b2b !important;
            border-bottom: 1px solid rgba(0,0,0,0.4); /* Split line effect */
        }

        .tick-flip-shadow-top, 
        .tick-flip-shadow-bottom {
            opacity: 0.2; /* Softens the shadow for a cleaner tech aesthetic */
        }
    </style>
</head>
<body>

    <!-- 3. The HTML Template for the Flip Display -->
    <div class="tick" id="test-board" data-did-init="handleTickInit">
        <div data-repeat="true" data-layout="horizontal center">
            <span data-view="flip"></span>
        </div>
    </div>

    <!-- 4. PQINA Flip Library JS -->
    <script src="https://unpkg.com/@pqina/flip/dist/flip.min.js"></script>

    <script>
        function handleTickInit(tick) {
            // Setup the Audio - uses your verified wav link
            const clickSound = new Audio('click.wav');
            clickSound.volume = 0.15;

            // List of words to rotate through
            const rawWords = ["RESEARCH", "DATA", "PROGRAM", "STRATEGY", "PRODUCT"];
            const maxLen = 8; // Length of longest word (RESEARCH/STRATEGY)

            // Left-justifies word and fills remaining slots with blank tiles
            const prepareWord = (word) => {
                return word.padEnd(maxLen, " ");
            };

            // SOUND ENGINE: Fires on every flip event[cite: 3]
            tick.on('update', function(value) {
                // Clone node allows sounds to stack into a "clatter"[cite: 2]
                const soundClone = clickSound.cloneNode();
                soundClone.play().catch(e => {
                    // Logs if browser blocks autoplay before user interaction
                    console.log("Waiting for user interaction to enable audio...");
                });
            });

            // Set initial word
            tick.value = prepareWord(rawWords[0]);

            // Rotation loop
            let i = 0;
            setInterval(function() {
                i = (i + 1) % rawWords.length;
                tick.value = prepareWord(rawWords[i]);
            }, 3500);
        }

        // Add a listener to handle the browser's autoplay block[cite: 2]
        document.body.addEventListener('click', function() {
            console.log("Audio context resumed via user interaction.");
        }, { once: true });
    </script>
</body>
</html>
