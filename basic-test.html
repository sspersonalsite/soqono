<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soqóno | Mechanical Display</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://unpkg.com/@pqina/flip/dist/flip.min.css" rel="stylesheet">
    
   <style>
    body { 
        background: #2B2D42; 
        display: flex; 
        flex-direction: column;
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        margin: 0; 
        overflow: hidden;
        font-family: sans-serif;
    }

    #audio-gate {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); color: white;
        display: flex; justify-content: center; align-items: center;
        z-index: 9999; cursor: pointer; text-transform: uppercase;
        letter-spacing: 2px; font-weight: bold;
    }

    .tick { 
        font-size: 5.5rem; 
        color: #EDF2F4; 
    }

    .tick-credits { display: none !important; }

    /* TILE CONTAINER */
    .tick-flip {
        width: 1.2em; 
        height: 1.5em;
        background-color: #1a1b2b !important;
        border-radius: 4px !important;
        margin: 0 0.05em;
    }

    /* THE FIX: Force the internal panels to use Grid Centering */
    .tick-flip-panel {
        display: grid !important;
        place-content: center !important; /* Centers both horizontally and vertically */
        background-color: #1a1b2b !important;
        border-bottom: 1px solid rgba(0,0,0,0.4); 
    }

    /* 
       THE CRITICAL OVERRIDE: 
       The library uses position:absolute which causes the "top-left" jump.
       We set it to 'static' so it obeys the Grid 'place-content' rule.
    */
    .tick-flip-text-wrapper {
        position: static !important;
        display: block !important;
        line-height: 1 !important;
        text-indent: 0 !important;
    }

    .tick-flip-shadow-top, .tick-flip-shadow-bottom { opacity: 0.2; }
</style>
    
</head>
<body>

    <div id="audio-gate">Click to Start Mechanical Display</div>

    <div class="tick" id="test-board" data-did-init="handleTickInit">
        <div data-repeat="true" data-layout="horizontal center">
            <span data-view="flip"></span>
        </div>
    </div>

    <script src="https://unpkg.com/@pqina/flip/dist/flip.min.js"></script>

    <script>
        const AUDIO_URL = 'click.m4a'; 
        const clickSound = new Audio(AUDIO_URL);
        clickSound.volume = 0.2;

        const gate = document.getElementById('audio-gate');
        gate.addEventListener('click', () => {
            clickSound.play().then(() => {
                clickSound.pause(); 
                gate.style.display = 'none';
            }).catch(err => console.error("Audio Load Error:", err));
        });

        function handleTickInit(tick) {
            const rawWords = ["RESEARCH", "DATA", "PROGRAM", "STRATEGY", "PRODUCT"];
            const maxLen = 8; 

            const prepareWord = (word) => {
                return word.padEnd(maxLen, " ");
            };

            tick.value = prepareWord(rawWords[0]);

            function playClatter() {
                const soundClone = clickSound.cloneNode();
                soundClone.play().catch(() => {});
            }

            let i = 0;
            setInterval(function() {
                i = (i + 1) % rawWords.length;
                tick.value = prepareWord(rawWords[i]);
                
                let clatterCount = 0;
                const clatterInterval = setInterval(() => {
                    playClatter();
                    clatterCount++;
                    if (clatterCount > 12) clearInterval(clatterInterval);
                }, 75); 
            }, 3500);
        }
    </script>
</body>
</html>
