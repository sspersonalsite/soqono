<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soqóno | Interactive Display</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://unpkg.com/@pqina/flip/dist/flip.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #2B2D42;
            --tile-bg: #1a1b2b;
            --text-color: #EDF2F4;
        }

        body { 
            background: var(--bg-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            font-family: sans-serif;
        }

        /* ELEGANT SOUND TOGGLE */
        #sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #sound-toggle:hover {
            background: rgba(255,255,255,0.1);
            border-color: var(--text-color);
        }

        #sound-toggle svg {
            fill: var(--text-color);
            width: 20px;
            height: 20px;
            opacity: 0.5;
        }

        #sound-toggle.is-active svg {
            opacity: 1;
        }

        /* MECHANICAL BOARD STYLING */
        .tick { 
            font-size: 5.5rem; 
            color: var(--text-color); 
        }

        .tick-credits { display: none !important; }

        .tick-flip {
            width: 1.2em; 
            height: 1.5em;
            background-color: var(--tile-bg) !important;
            border-radius: 4px !important;
            margin: 0 0.05em;
        }

        /* GRID CENTERING (Screenshot 2026-05-02 160554.png Fix) */
        .tick-flip-panel {
            display: grid !important;
            place-content: center !important;
            background-color: var(--tile-bg) !important;
            border-bottom: 1px solid rgba(0,0,0,0.4); 
        }

        .tick-flip-text-wrapper {
            position: static !important;
            display: block !important;
            line-height: 1 !important;
            text-indent: 0 !important;
        }

        .tick-flip-shadow-top, .tick-flip-shadow-bottom { opacity: 0.2; }
    </style>
</head>
<body>

    <!-- Subtle Icon Toggle -->
    <button id="sound-toggle" aria-label="Toggle Sound">
        <svg id="icon-mute" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM3 9v6h4l5 5V4L7 9H3z"/></svg>
    </button>

    <div class="tick" id="test-board" data-did-init="handleTickInit">
        <div data-repeat="true" data-layout="horizontal center">
            <span data-view="flip"></span>
        </div>
    </div>

    <script src="https://unpkg.com/@pqina/flip/dist/flip.min.js"></script>

    <script>
        const clickSound = new Audio('click.m4a');
        clickSound.volume = 0.2;
        
        let soundEnabled = false;

        // Toggle Logic
        const toggleBtn = document.getElementById('sound-toggle');
        toggleBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            toggleBtn.classList.toggle('is-active', soundEnabled);
            
            // Interaction "unlocks" the audio for the browser
            if (soundEnabled) {
                clickSound.play().then(() => {
                    clickSound.pause();
                    clickSound.currentTime = 0;
                });
            }
        });

        function handleTickInit(tick) {
            const rawWords = ["RESEARCH", "DATA", "PROGRAM", "STRATEGY", "PRODUCT"];
            const maxLen = 8;
            const prepareWord = (word) => word.padEnd(maxLen, " ");

            tick.value = prepareWord(rawWords[0]);

            function playClatter() {
                if (!soundEnabled) return;
                const soundClone = clickSound.cloneNode();
                soundClone.play().catch(() => {});
            }

            let i = 0;
            setInterval(function() {
                i = (i + 1) % rawWords.length;
                tick.value = prepareWord(rawWords[i]);
                
                // Only clatter if user enabled sound
                if (soundEnabled) {
                    let count = 0;
                    const clatter = setInterval(() => {
                        playClatter();
                        count++;
                        if (count > 10) clearInterval(clatter);
                    }, 70);
                }
            }, 3500);
        }
    </script>
</body>
</html>
