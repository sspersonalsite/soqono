<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soqóno | High-Fidelity Mechanical Board</title>
    <!-- 1. PQINA Flip Library CSS -->
    <link href="https://unpkg.com/@pqina/flip/dist/flip.min.css" rel="stylesheet">
    <style>
        body { 
            background: #2B2D42; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }

        /* 2. Board Styling based on Screenshot 2026-05-02 151723.jpg */
        .tick { 
            font-size: 5.5rem; 
            font-family: sans-serif; 
            color: #EDF2F4; 
        }

        /* Get rid of the "Powered by PQINA" text as requested[cite: 1] */
        .tick-credits { 
            display: none !important; 
        }

        /* Force each letter into an independent mechanical tile[cite: 1, 3] */
        .tick-flip {
            width: 1.1em; 
            height: 1.5em;
            background-color: #1a1b2b !important;
            border-radius: 4px !important;
            margin: 0 0.05em;
        }

        .tick-flip-panel {
            background-color: #1a1b2b !important;
            border-bottom: 1px solid rgba(0,0,0,0.4); 
        }

        .tick-flip-shadow-top, 
        .tick-flip-shadow-bottom {
            opacity: 0.2; 
        }
    </style>
</head>
<body>

    <!-- 3. The HTML Template for the Flip Display[cite: 3] -->
    <div class="tick" id="test-board" data-did-init="handleTickInit">
        <div data-repeat="true" data-layout="horizontal center">
            <span data-view="flip"></span>
        </div>
    </div>

    <!-- 4. PQINA Flip Library JS -->
    <script src="https://unpkg.com/@pqina/flip/dist/flip.min.js"></script>

    <script>
        function handleTickInit(tick) {
            // Setup the Audio
            const clickSound = new Audio('click.wav');
            clickSound.volume = 0.15;

            // List of words
            const rawWords = ["RESEARCH", "DATA", "PROGRAM", "STRATEGY", "PRODUCT"];
            const maxLen = 8; 

            const prepareWord = (word) => {
                return word.padEnd(maxLen, " ");
            };

            // Initial value
            tick.value = prepareWord(rawWords[0]);

            // 5. FIXED SOUND ENGINE: 
            // We use a separate interval to trigger the clatter sound during flips
            function playClatter() {
                const soundClone = clickSound.cloneNode();
                soundClone.play().catch(() => {
                    console.log("Interaction required for audio");
                });
            }

            // Word rotation loop
            let i = 0;
            setInterval(function() {
                i = (i + 1) % rawWords.length;
                tick.value = prepareWord(rawWords[i]);
                
                // Play a series of clicks to match the flipping animation
                let clatterCount = 0;
                const clatterInterval = setInterval(() => {
                    playClatter();
                    clatterCount++;
                    if (clatterCount > 10) clearInterval(clatterInterval);
                }, 80); 
            }, 3500);
        }

        // Handle autoplay permissions[cite: 2]
        document.body.addEventListener('click', function() {
            console.log("Audio Enabled");
        }, { once: true });
    </script>
</body>
</html>
