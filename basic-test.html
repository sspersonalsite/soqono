<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PQINA Basic Test - Fixed</title>
    <link href="https://unpkg.com/@pqina/flip/dist/flip.min.css" rel="stylesheet">
    <style>
        body { background: #2B2D42; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .tick { font-size: 5rem; font-family: sans-serif; color: white; }
        .tick-credits { display: none !important; } /* Get rid of PQINA credit[cite: 1] */
    </style>
</head>
<body>

    <!-- The data-value here ensures the library has a starting point -->
    <div class="tick" id="test-board" data-value="RESEARCH">
        <div data-repeat="true" data-layout="horizontal center">
            <span data-view="flip"></span>
        </div>
    </div>

    <script src="https://unpkg.com/@pqina/flip/dist/flip.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Check if library exists
            if (typeof Tick === 'undefined') {
                console.error("Tick library not loaded");
                return;
            }

            // Reference the element[cite: 3]
            const boardElement = document.getElementById('test-board');

            // Initialize and catch the instance
            const tickInstance = Tick.DOM.create(boardElement);

            // Verify the instance exists before trying to use .value
            if (tickInstance) {
                console.log("Tick initialized successfully");
                
                const words = ["RESEARCH", "PROGRAM", "STRATEGY"];
                let i = 0;

                setInterval(() => {
                    i = (i + 1) % words.length;
                    // This was the line failing; now protected by the if(tickInstance) check[cite: 2]
                    tickInstance.value = words[i];
                }, 3000);
            } else {
                console.error("Tick failed to create instance. Check HTML structure.");
            }
        });
    </script>
</body>
</html>
