<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PQINA Basic Test - Fixed Syntax</title>
    <link href="https://unpkg.com/@pqina/flip/dist/flip.min.css" rel="stylesheet">
    <style>
        body { background: #2B2D42; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .tick { font-size: 5rem; font-family: sans-serif; color: white; }
        .tick-credits { display: none !important; }
        .tick-flip-panel { background-color: #1a1b2b !important; }
    </style>
</head>
<body>

    <div class="tick" id="test-board" data-value="RESEARCH" data-did-init="handleTickInit">
        <div data-repeat="true" data-layout="horizontal center">
            <span data-view="flip"></span>
        </div>
    </div>

    <script src="https://unpkg.com/@pqina/flip/dist/flip.min.js"></script>

    <script>
        function handleTickInit(tick) {
            const words = ["RESEARCH", "PROGRAM", "STRATEGY", "PRODUCT"];
            let i = 0;

            setInterval(function() {
                i = (i + 1) % words.length;
                tick.value = words[i];
            }, 3000);
        }
    </script>
</body>
</html>
