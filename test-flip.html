<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanical Board Test</title>
    <style>
        :root {
            --bg-color: #2B2D42;
            --flap-bg: #1a1b2b;
            --text-color: #EDF2F4;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        .board {
            display: flex;
            gap: 4px;
        }

        .flap {
            position: relative;
            width: 60px;
            height: 90px;
            background-color: var(--flap-bg);
            border-radius: 4px;
            font-size: 70px;
            font-weight: bold;
            color: var(--text-color);
            text-align: center;
            line-height: 90px;
            perspective: 200px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        /* The horizontal divider line */
        .flap::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(0,0,0,0.5);
            z-index: 5;
        }

        /* Animation class */
        .flipping {
            animation: flipAnim 0.15s ease-in;
        }

        @keyframes flipAnim {
            0% { transform: rotateX(0deg); }
            50% { transform: rotateX(-90deg); background: #333; }
            100% { transform: rotateX(0deg); }
        }
    </style>
</head>
<body>

    <div class="board" id="flap-board">
        <!-- Flaps will be generated here -->
    </div>

    <script>
        const words = ["RESEARCH", "DATA", "PROGRAM", "STRATEGY", "PRODUCT"];[cite: 2]
        const chars = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        let currentWordIndex = 0;
        const board = document.getElementById('flap-board');
        const clickSound = new Audio('click.wav');
        clickSound.volume = 0.1;

        // 1. Create the initial flaps
        function createFlaps(word) {
            board.innerHTML = '';
            for (let i = 0; i < 10; i++) { // Fixed 10 character width
                const flap = document.createElement('div');
                flap.className = 'flap';
                flap.innerText = word[i] || ' ';
                board.appendChild(flap);
            }
        }

        // 2. The logic to flip a single character to its target
        function flipLetter(flapElement, targetChar) {
            let currentChar = flapElement.innerText;
            if (currentChar === targetChar) return;

            let currentIndex = chars.indexOf(currentChar);
            let nextIndex = (currentIndex + 1) % chars.length;
            let nextChar = chars[nextIndex];

            // Visual Flip
            flapElement.classList.remove('flipping');
            void flapElement.offsetWidth; // Trigger reflow
            flapElement.classList.add('flipping');
            
            flapElement.innerText = nextChar;

            // Play Sound
            clickSound.cloneNode().play().catch(() => {});

            // Repeat until match
            setTimeout(() => {
                flipLetter(flapElement, targetChar);
            }, 100); 
        }

        function updateBoard() {
            currentWordIndex = (currentWordIndex + 1) % words.length;
            const targetWord = words[currentWordIndex];
            const flaps = document.querySelectorAll('.flap');

            flaps.forEach((flap, i) => {
                const targetChar = targetWord[i] || ' ';
                // Add slight delay per flap for "ripple" effect
                setTimeout(() => {
                    flipLetter(flap, targetChar);
                }, i * 50);
            });
        }

        // Initialize
        createFlaps(words[0]);
        setInterval(updateBoard, 3500);
    </script>
</body>
</html>
